name: Android verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build, test domain invariants, and lint
        run: bash gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --console=plain --max-workers=2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            core/build/reports/tests/test/
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build test APKs
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --max-workers=2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real device tests and reject empty results
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r dev.sajancodes.hardblock.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation-results.txt
            grep -Eq 'OK \([1-9][0-9]* tests?\)' instrumentation-results.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: instrumentation-evidence
          path: instrumentation-results.txt
